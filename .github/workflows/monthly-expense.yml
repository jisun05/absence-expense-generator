name: Monthly Expense Generator

on:
  schedule:
    # 매월 5일 오전 9시
    - cron: '0 8 5 * *'
  workflow_dispatch:

jobs:
  generate-expense:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-deu


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Create Google credentials file
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json


      - name: Run expense generator
        env:
          ABSENCE_CLIENT_ID: ${{ secrets.ABSENCE_CLIENT_ID }}
          ABSENCE_CLIENT_SECRET: ${{ secrets.ABSENCE_CLIENT_SECRET }}
          GOOGLE_DRIVE_RECEIPT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_RECEIPT_FOLDER_ID }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: python main.py