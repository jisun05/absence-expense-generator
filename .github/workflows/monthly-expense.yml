name: Monthly Expense Generator

on:
  schedule:
    # 매월 5일 오전 9시
    - cron: '0 8 5 * *'
  workflow_dispatch:

jobs:
  generate-expense:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Tesseract OCR 설치
      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-deu

      # 4. Python 의존성 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Google OAuth 인증 파일 생성
      - name: Create Google credentials file
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json

      # 6. 월별 식대 청구 프로그램 실행
      - name: Run expense generator
        env:
          ABSENCE_CLIENT_ID: ${{ secrets.ABSENCE_CLIENT_ID }}
          ABSENCE_CLIENT_SECRET: ${{ secrets.ABSENCE_CLIENT_SECRET }}
          ABSENCE_USER_ID: ${{ secrets.ABSENCE_USER_ID }}
          GOOGLE_DRIVE_RECEIPT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_RECEIPT_FOLDER_ID }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: python main.py

      # 7. Excel 및 PDF 결과물 업로드
      - name: Upload expense reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-expense-reports
          path: |
            output/*.xlsx
            output/*.pdf
          if-no-files-found: warn
          retention-days: 30