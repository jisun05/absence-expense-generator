services:
  db:
    image: postgres:16
    container_name: absence-expense-db
    environment:
      POSTGRES_DB: absence_expense
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: expense_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  app:
    build: .
    container_name: absence-expense-app
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: absence_expense
      DB_USER: expense_user
      DB_PASSWORD: expense_password

volumes:
  postgres_data: